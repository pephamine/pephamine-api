version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pephamine-db
    environment:
      POSTGRES_USER: pephamine
      POSTGRES_PASSWORD: pephamine_dev_password
      POSTGRES_DB: pephamine
    ports:
      - "5432:5432"
    volumes:
      - pephamine_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pephamine"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pephamine_data:
